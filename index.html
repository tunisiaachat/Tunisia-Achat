<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tunisiabet206 - Live Scores</title>
<style>
body{margin:0;font-family:sans-serif;background:#111827;color:white}
header{background:#16a34a;padding:20px;text-align:center}
h1{margin:0;font-size:28px}
.search-box{padding:15px}
input{width:100%;padding:14px;border-radius:10px;border:none;font-size:16px;box-sizing:border-box}
.live{color:#ef4444;font-weight:bold;font-size:13px}
.match{background:white;color:#111;margin:0 15px 12px;padding:15px;border-radius:12px}
.row{display:flex;justify-content:space-between;align-items:center}
.team{font-size:17px}
.score{font-weight:bold;font-size:20px;background:#111827;color:white;padding:5px 12px;border-radius:8px}
.minute{font-size:12px;color:#666}
</style>
</head>
<body>
<header>
<h1>Tunisiabet206 🇹🇳</h1>
<p>Live Scores - Koura Tounsiya</p>
</header>

<div class="search-box">
<input id="search" onkeyup="filter()" placeholder="🔍 Lawj 3la jam3iya... EST, CA, ESS...">
</div>

<div id="list">
<div class="match"><span class="live">● LIVE 67'</span><div class="row"><span class="team">EST - Esperance</span><span class="score">2 - 1</span><span class="team">CA - Club Africain</span></div><div class="minute">Stade Rades - Derby</div></div>
<div class="match"><span class="live">● LIVE 34'</span><div class="row"><span class="team">ESS - Etoile Sahel</span><span class="score">0 - 0</span><span class="team">CSS - Sfaxien</span></div><div class="minute">Stade Sousse</div></div>
<div class="match"><span>⏰ 16:00</span><div class="row"><span class="team">CAB - Bizertin</span><span class="score">VS</span><span class="team">ST - Stade Tunisien</span></div><div class="minute">Samedi</div></div>
<div class="match"><span>✅ Terminé</span><div class="row"><span class="team">USM - Monastir</span><span class="score">1 - 0</span><span class="team">OB - Beja</span></div><div class="minute">Hier</div></div>
</div>

<p style="text-align:center;color:#9ca3af">© 2026 Tunisiabet206</p>
<script>
function filter(){
let v=document.getElementById('search').value.toLowerCase();
let matchs=document.querySelectorAll('.match');
matchs.forEach(m=>{
if(m.innerText.toLowerCase().includes(v)){m.style.display='block'}else{m.style.display='none'}
});
}
</script>
</body>
</html>
